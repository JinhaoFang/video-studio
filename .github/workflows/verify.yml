# Verify spec pushes and PR source commits targeting main. Official actions are
# pinned to checkout v7.0.1, setup-node v7.0.0 and pnpm/action-setup v6.1.0 (Node 24).
# Reproduce locally: pnpm verify; pnpm check:commits origin/main <source-branch>.
name: Verify

on:
  push:
    branches:
      - "spec/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.3"

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Check branch commit messages
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm check:commits origin/main "$SOURCE_BRANCH"
