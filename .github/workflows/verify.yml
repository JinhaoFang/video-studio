# Verify spec pushes and PR source commits targeting main. Official actions are
# pinned to checkout v4.2.2, setup-node v4.4.0 and pnpm/action-setup v4.1.0.
# Reproduce locally: pnpm verify; pnpm check:commits origin/main <source-branch>.
name: Verify

on:
  push:
    branches:
      - "spec/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Check branch commit messages
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm check:commits origin/main "$SOURCE_BRANCH"
