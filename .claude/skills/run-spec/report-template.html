<!doctype html>
<!--
单文件 spec 汇报模板：浏览器直接打开，可断网使用。复制后替换脚本块开头的 data
数组；report 是标题、任务与截点，ticket/dispatch/session/independent/subagent 是
工单和用量，goal 是同口径改前改后与结论，finding/review 是发现和审查。其余 type
分别驱动同名节的表与文字。未知数填 null，不填 0；输入包含缓存，不重复相加。
汇总只加已知项并标明缺项数；比值所需项缺失时写未知，对比条只画已知部分。
示例取自本仓库 spec #77 汇报、子工单验收与 PR #91；精确缺项在页面中列明。
只可选省略领域结果：删除 domain 数据后整节自动隐藏；其余节缺项写明未知和依据。
要添加领域结果图，在 data 中加入该领域的测量记录，在同一脚本块内用 comparison
或 DOM/SVG 绘制并附文字标注；沿用下方定稿变量，不引外部资源，不新增全局名字。
版式与配色来自 PathJX a6c42b1 的 spec #27 汇报，移除外部字体及不适用的领域内容；
本模板按新版写法调整节次与图表。所有脚本保持一个块，只用 const/let 和箭头函数。
设计工单有起止时间时画横条；只有验收关闭时刻时合在一行画点，颜色与 Claude 用量条一致。
goal 的 conclusion 填达成／部分达成／未达成；before、after 共用 unit，只有有限数字且
单位非空时画条，其余列入表格。domain 的 cells 按 report.domainHeadings 的顺序填写。
session 可有多条，仅一条设 compare: true；replies 随该会话填写，用于计算平均上下文。
report.costNote、comparisonNote 可选，缺省按已录入用量生成；localVerificationUrl 可选。
repoUrl、sourceRef 分别指定仓库和 docs/ 相对证据链接的版本。
-->

          );
          const timed = entries.filter((entry) => entry.start && entry.end);
          const milestones = entries.filter(
            (entry) =>
              entry.kind === "design" &&
              !(entry.start && entry.end) &&
              entry.closed,
          );
          const instants = milestones.map((entry) => Date.parse(entry.closed));
          const start =
            timed.length || instants.length
              ? Math.min(
                  ...timed.map((entry) => Date.parse(entry.start)),
                  ...instants,
                )
              : 0;
          const end =
            timed.length || instants.length
              ? Math.max(
                  ...timed.map((entry) => Date.parse(entry.end)),
                  ...instants,
                )
              : start;
          const span = end - start;
          const container = slot("timeline");
          container.replaceChildren();
          if (timed.length || milestones.length) {
            const axis = element("div", "axis");
            axis.append(
              element("span", "", time(new Date(start).toISOString())),
              element("span", "", "北京时间"),
              element("span", "", time(new Date(end).toISOString())),
            );
            container.append(axis);
          }
          if (!entries.length)
            container.append(element("p", "sub", "该筛选下无记录。"));
          for (const entry of entries) {
            if (milestones.includes(entry)) continue;
            const row = element("div", "timeline-row");
            row.dataset.run = entry.id;
            const label = element("div", "timeline-label");
            const detail = element("small");
            detail.append(
              `${time(entry.start)}–${time(entry.end)}`,
              element("br"),
              `${format(entry.minutes, 1)} 分 · ${entry.status}${entry.closed ? `；验收关闭 ${time(entry.closed)}` : ""}`,
            );
            label.append(
              `${entry.id} · ${entry.label} · ${kinds[entry.kind].label}`,
              detail,
            );
            const track = element("div", "track");
            if (entry.start && entry.end) {
              const bar = element("span", "bar");
              bar.style.left = `${percent(Date.parse(entry.start) - start, span)}%`;
              bar.style.width = `${percent(Date.parse(entry.end) - Date.parse(entry.start), span)}%`;
              bar.style.background = kinds[entry.kind].color;
              track.title = `${entry.id} ${time(entry.start)}–${time(entry.end)}，${format(entry.minutes, 1)} 分，${entry.status}`;
              track.append(bar);
            } else
              track.append(element("span", "compare-value", "起止／分钟未知"));
            row.append(label, track);
            container.append(row);
          }
          if (milestones.length) {
            const row = element("div", "timeline-row");
            const label = element("div", "timeline-label", "设计工单");
            label.append(element("small", "", "验收关闭时刻"));
            const track = element("div", "track milestone-track");
            for (const entry of milestones) {
              const lane = element("div", "milestone-lane");
              const point = evidence("", entry.source);
              const description = `#${entry.ticket} · ${entry.label} · ${entry.status} · 验收关闭 ${time(entry.closed)}`;
              point.className = "timeline-point";
              point.dataset.run = entry.id;
              point.title = description;
              point.setAttribute("aria-label", description);
              point.style.left = `${span > 0 ? percent(Date.parse(entry.closed) - start, span) : 50}%`;
              point.style.background = kinds.design.color;
              lane.append(point);
              track.append(lane);
            }
            row.append(label, track);
            container.append(row);
          }
          text(
            "timeline-note",
            `${format(entries.length)} 条当前记录；${meta.dispatchNote}`,
          );
        };
        daySelect.addEventListener("change", drawTimeline);
        kindSelect.addEventListener("change", drawTimeline);
        drawTimeline();
        const costRow = (label, entries) => [
          label,
          known(entries, "minutes", 1),
          known(entries, "input"),
          known(entries, "cacheRead"),
          known(entries, "output"),
        ];
        const costHeadings = [
          "范围",
          "累计分钟",
          "输入 tokens",
          "其中缓存读取",
          "输出 tokens",
        ];
        table("cost-summary", costHeadings, [
          costRow("Codex 工程派发（含返工）", engineering),
          costRow("Codex 按批与收尾审查（父运行）", reviews),
          ...sessions.map((entry) => costRow(entry.label, [entry])),
          costRow("Claude 独立审查", independent),
          costRow("Codex 审查子代理", children),
        ]);
        const comparedSessions = sessions.filter(
          (entry) => entry.compare === true,
        );
        const comparedSession =
          comparedSessions.length === 1 ? comparedSessions[0] : null;
        const comparisonSessions = comparedSession ? [comparedSession] : [];
        const comparisonLabel =
          comparedSession?.label ?? "未知（未指定唯一的对比主会话）";
        const allCosts = [...codex, ...sessions, ...independent];
        text(
          "cost-note",
          meta.costNote ??
            `输入含缓存；其中缓存列仅列缓存读取。${allCosts.some((entry) => entry.cacheWrite != null) ? "已记录的缓存创建也计入输入。" : ""}累计用时包含并行与嵌套，不相加成墙钟时间；${format(allCosts.filter((entry) => entry.minutes == null).length)} 条记录缺用时。`,
        );
        text(
          "comparison-note",
          `用于对比的主会话：${comparisonLabel}。${meta.comparisonNote ?? `对比范围为该主会话与全部 Codex 运行（工程、审查及其子代理）；${independent.length ? `独立 Claude 审查另列：输入 ${known(independent, "input")} tokens，输出 ${known(independent, "output")} tokens。` : "无独立审查记录。"}`}`,
        );
        const mainInput = sum(comparisonSessions, "input"),
          mainOutput = sum(comparisonSessions, "output");
        const codexInput = sum(codex, "input"),
          codexOutput = sum(codex, "output");
        for (const [label, mainValue, codexValue] of [
          ["输入（含缓存）", mainInput, codexInput],
          ["输出", mainOutput, codexOutput],
        ]) {
          comparison(slot("cost-chart"), label, [
            {
              label: comparisonLabel,
              ...mainValue,
              unit: "tokens",
              color: "var(--d)",
            },
            {
              label: "Codex 全部",
              ...codexValue,
              unit: "tokens",
              color: "var(--a)",
            },
          ]);
        }
        text(
          "efficiency",
          `主会话 / Codex 总用量比（输入＋输出）：${ratio(sum(comparisonSessions, "input", "output"), sum(codex, "input", "output"))}；输入比 ${ratio(mainInput, codexInput)}，输出比 ${ratio(mainOutput, codexOutput)}。主会话平均上下文：${mainInput.value != null && !mainInput.missing && comparedSession?.replies > 0 ? format(mainInput.value / comparedSession.replies) + " tokens / 回复" : "未知"}（含缓存输入 ÷ ${format(comparedSession?.replies)} 次回复）。`,
        );
        table(
          "cost-detail",
          ["派发／类别", "起止／状态", "分钟", "输入", "缓存读取", "输出"],
          dispatches.map((entry) => {
            const run = timeline.find((candidate) => candidate.id === entry.id);
            return [
              evidence(
                `${entry.id} · ${kinds[entry.kind].label}`,
                entry.source,
              ),
              `${time(run.start)}–${time(run.end)} · ${entry.status}`,
              format(entry.minutes, 1),
              format(entry.input),
              format(entry.cacheRead),
              format(entry.output),
            ];
          }),
        );
        table(
          "other-cost",
          costHeadings,
          [...sessions, ...independent, ...children].map((entry) =>
            costRow(entry.label + (entry.parent ? ` · ${entry.parent}` : ""), [
              entry,
            ]),
          ),
        );
        const quality = slot("quality");
        quality.append(
          `测试基线 ${format(meta.testsBefore)} → 最终 ${format(meta.testsAfter)} 项，增加 ${meta.testsBefore != null && meta.testsAfter != null ? format(meta.testsAfter - meta.testsBefore) : "未知"} 项。CI：`,
          link(meta.ciUrl, meta.ciStatus),
          "；本地：",
          statement(
            meta.localVerification ?? "未知",
            meta.localVerificationUrl,
          ),
          "。",
        );
        table(
          "checks",
          ["关键实测", "结论与证据"],
          of("check").map((entry) => [
            entry.label,
            statement(entry.text, entry.source),
          ]),
        );
        text(
          "finding-note",
          `本页逐项列出 ${format(findings.length)} 项发现；表中发现数由清单计算，覆盖口径见数据口径与缺项。`,
        );
        table(
          "reviews",
          ["审查", "状态", "本页发现数", "取舍"],
          of("review").map((entry) => [
            evidence(entry.label, entry.source),
            entry.status,
            format(
              findings.filter((finding) => finding.review === entry.id).length,
            ),
            entry.note,
          ]),
        );
        table(
          "findings",
          ["发现", "来源", "处理", "状态"],
          findings.map((entry) => {
            const review = of("review").find(
              (candidate) => candidate.id === entry.review,
            );
            return [
              `${entry.severity} · ${entry.label}`,
              review ? evidence(review.label, review.source) : entry.review,
              `${entry.handling}：${entry.detail}`,
              entry.status,
            ];
          }),
        );
        table(
          "decisions",
          ["谁", "决定", "理由"],
          of("decision").map((entry) => [
            entry.owner,
            statement(entry.text, entry.source),
            entry.reason,
          ]),
        );
        table(
          "problems",
          ["问题与责任", "影响与处理"],
          of("problem").map((entry) => [
            `${entry.label}（${entry.owner}）`,
            statement(entry.impact, entry.source),
          ]),
        );
        for (const entry of of("next"))
          slot("next").append(element("li", "", entry.text));
        table(
          "gaps",
          ["口径／缺项", "说明"],
          of("gap").map((entry) => [
            entry.label,
            statement(entry.text, entry.source),
          ]),
        );
        for (const entry of of("source")) {
          const item = element("li");
          item.append(evidence(entry.label, entry.url));
          slot("sources").append(item);
        }
        slot("footer").append(
          `数据截点：${time(meta.asOf)}（${meta.timezone}）；主会话用量截点见数据口径。来源：`,
        );
        for (const [index, entry] of of("source").entries()) {
          if (index) slot("footer").append(" · ");
          slot("footer").append(evidence(entry.label, entry.url));
        }
      }
    </script>
  </body>
</html>
