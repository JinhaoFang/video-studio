<!doctype html>
<!--
  单文件 spec 汇报模板：直接用浏览器打开，可断网使用，无外部资源。
  换数据只改脚本块开头的 data 数组：report 是标题与来源；dispatch 每次派发一条，
  start 用本期首日零点起算的 HH:mm（次日可写 24:46），minutes 是累计运行分钟；
  input 含缓存，cacheRead 是其中缓存，output 是输出；design 的 input 不含缓存，
  总输入按 input + cacheWrite + cacheRead 计算；previous 是上一期已知用量。
  finding 每条发现一条，handling 的相同文字会自动归组。所有数字、图表和注记都由数组派生。
  新流程图：替换 node 与 edge 记录；node 用唯一 id、label、detail、row、col 描述方框，
  桌面 col 为 0 或 1、row 从 0 起；edge 用 from、to 指向节点 id，节点间用直线连接。
  手机按 node 在数组里的顺序纵向排列；分支连线须留出空位，用浏览器复核不穿过其他方框。
  示例数据均来自 docs/reports/spec-60-nasa-punk-opening.html：18 次有记录的派发、
  4 条审查发现；原汇报未给出 #74 工程运行的用时和用量，不补估算。
  折线按派发完成时刻累计输出，不代表逐 token 实时采样；审查用量含原汇报记录的子代理。
  延续 spec #60 的单栏版式、颜色、字号、间距与卡片样式，只使用系统字体。
  TODO(design)：确认新增折线、处理分布与流程图的保守排布；这三类组件无既有定稿。
-->

        width: var(--length);

        height: 100%;
        background: var(--series);
        border-radius: 3px;

        gap: 4px;
      }
      .bar-label {

        font-size: 13px;
      }
      .bar-value {

      }
      .bar-track {
        height: 18px;
        border-radius: 4px;
        background: var(--bg);
      }
      .bar-fill {
        width: var(--length);
        height: 100%;
        border-radius: 3px;
        background: var(--series);
      }
      .usage-group {
        display: grid;
        gap: 10px;
      }
      .items {

        display: grid;

        const findings = select("finding");
        const nodes = select("node");
        const edges = select("edge");
        const kinds = {
          feature: { label: "工程工单", color: "var(--s-feature)" },
          rework: { label: "返工", color: "var(--s-rework)" },
          review: { label: "Codex 审查", color: "var(--s-review)" },
        };
        const format = (value) => Math.round(value).toLocaleString("en-US");
        const minutes = (time) => {
          const [hour, minute] = time.split(":").map(Number);
          return hour * 60 + minute;
        };
        const clock = (value) => {
          const rounded = Math.round(value);
          const day = Math.floor(rounded / (24 * 60));
          const hour = Math.floor(rounded / 60) % 24;
          const minute = String(rounded % 60).padStart(2, "0");
          return `${day ? `+${day}日 ` : ""}${String(hour).padStart(2, "0")}:${minute}`;
        };
        const byId = (id) => document.getElementById(id);
        const setText = (id, value) => {
          byId(id).textContent = value;
        };
        const element = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };
        const svgElement = (tag, attributes = {}, text) => {
          const node = document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag,
          );
          for (const [key, value] of Object.entries(attributes))
            node.setAttribute(key, value);
          if (text !== undefined) node.textContent = text;
          return node;
        };
        const total = dispatches.reduce(
          (sum, entry) => ({
            minutes: sum.minutes + entry.minutes,
            input: sum.input + entry.input,
            cacheRead: sum.cacheRead + entry.cacheRead,
            output: sum.output + entry.output,
          }),
          { minutes: 0, input: 0, cacheRead: 0, output: 0 },
        );
        const reworks = dispatches.filter(
          (entry) => entry.kind === "rework",
        ).length;
        const designInput = design.input + design.cacheWrite + design.cacheRead;
        const start = dispatches.length
          ? Math.min(...dispatches.map((entry) => minutes(entry.start)))
          : 0;
        const end = dispatches.length
          ? Math.max(
              ...dispatches.map(
                (entry) => minutes(entry.start) + entry.minutes,
              ),
            )
          : 0;
        const span = end - start || 1;
        const percent = (value, maximum) =>
          maximum ? (value / maximum) * 100 : 0;
        const ratio = (value, reference) =>
          reference ? `${(value / reference).toFixed(2)} 倍` : "无对照数据";

        document.title = `${report.name} 执行汇报`;
        setText(
          "report-meta",
          `${report.name} · ${report.date} · ${report.timezone}`,
        );
        setText("report-title", report.title);
        setText("report-intro", report.intro);
        setText("source-note", report.source);
        setText("flow-note", report.flowNote);
        for (const [value, unit, label] of [
          [dispatches.length, "次", "有用量记录的 Codex 运行"],
          [
            total.minutes.toFixed(1),
            "分钟",
            `累计运行，含并行；返工 ${reworks} 次`,
          ],
          [findings.length, "项", "审查发现，处理方式见下图"],
          [
            format(designInput / (design.replies || 1)),
            "tokens",
            "Claude 主会话平均上下文（输入 / 回复）",
          ],
        ]) {
          const card = element("div", "kpi");
          const number = element("div", "num", `${value} `);
          number.append(element("small", "", unit));
          card.append(number, element("div", "label", label));
          byId("kpis").append(card);
        }

        for (const { label, color } of Object.values(kinds)) {
          const item = element("span", "", label);
          const swatch = element("i", "swatch");
          swatch.style.setProperty("--series", color);
          item.prepend(swatch);
          byId("timeline-legend").append(item);
        }
        for (const value of [start, start + span / 2, end])
          byId("time-axis").append(element("span", "", clock(value)));
        for (const entry of dispatches) {
          const row = element("div", "dispatch");
          row.dataset.dispatch = entry.id;
          const heading = element("div", "dispatch-head");
          const time = `${clock(minutes(entry.start))} → ${clock(minutes(entry.start) + entry.minutes)} · ${entry.minutes.toFixed(1)} 分钟`;
          heading.append(
            element(
              "b",
              "",
              `${entry.id} · ${entry.label} · ${kinds[entry.kind].label}`,
            ),
            element("span", "", time),
          );
          const track = element("div", "track");
          const bar = element("div", "duration");
          bar.style.setProperty(
            "--start",
            `${percent(minutes(entry.start) - start, span)}%`,
          );
          bar.style.setProperty("--length", `${percent(entry.minutes, span)}%`);
          bar.style.setProperty("--series", kinds[entry.kind].color);
          track.append(bar);
          row.append(heading, track);
          byId("timeline").append(row);
        }
        setText(
          "timeline-note",
          `${dispatches.length} 次运行共享同一时间轴；横条相互对齐可见并行。返工 ${reworks} 次；跨度 ${(end - start).toFixed(1)} 分钟，累计运行 ${total.minutes.toFixed(1)} 分钟。${report.dispatchNote}`,
        );

        const addBar = (parent, label, value, maximum, color, valueLabel) => {
          const row = element("div", "bar-row");
          const heading = element("div", "bar-label");
          heading.append(
            element("span", "", label),
            element("span", "bar-value", valueLabel),
          );
          const track = element("div", "bar-track");
          const bar = element("div", "bar-fill");
          bar.style.setProperty("--length", `${percent(value, maximum)}%`);
          bar.style.setProperty("--series", color);
          track.append(bar);
          row.append(heading, track);
          parent.append(row);
        };
        const usageGroup = (parent, title, entries, unit) => {
          const group = element("div", "usage-group");
          group.append(element("b", "label", title));
          const maximum = Math.max(0, ...entries.map((entry) => entry.value));
          for (const entry of entries)
            addBar(
              group,
              entry.label,
              entry.value,
              maximum,
              entry.color,
              `${unit === "分钟" ? entry.value.toFixed(1) : format(entry.value)} ${unit}`,
            );
          byId(parent).append(group);
        };
        for (const [key, title, designValue] of [
          ["input", "输入（含缓存）", designInput],
          ["output", "输出", design.output],
        ]) {
          usageGroup(
            "agent-usage",
            title,
            [
              {
                label: "Claude · 设计负责人",
                value: designValue,
                color: "var(--accent)",
              },
              {
                label: "Codex · 工程与审查",
                value: total[key],
                color: "var(--s-feature)",
              },
            ],
            "tokens",
          );
        }
        setText(
          "agent-note",
          `Claude / Codex 输入比 ${ratio(designInput, total.input)}；输出比 ${ratio(design.output, total.output)}。Claude 主会话 ${design.replies} 次回复；Codex 输入中缓存读取 ${format(total.cacheRead)} tokens。${design.note}`,
        );
        for (const [key, title, unit] of [
          ["input", "输入（含缓存）", "tokens"],
          ["output", "输出", "tokens"],
          ["minutes", "累计用时（含并行）", "分钟"],
        ]) {
          usageGroup(
            "previous-usage",
            title,
            [
              {
                label: `本次 · ${report.name}`,
                value: total[key],
                color: "var(--s-feature)",
              },
              {
                label: `上次 · ${previous.name}`,
                value: previous[key],
                color: "var(--s-prev)",
              },
            ],
            unit,
          );
        }
        setText(
          "previous-note",
          `本次 Codex 输出是 ${previous.name} 的 ${ratio(total.output, previous.output)}。${previous.note}各指标独立刻度，每组两条共用刻度。`,
        );

        const groups = new Map();
        for (const finding of findings)
          groups.set(finding.handling, (groups.get(finding.handling) || 0) + 1);
        for (const [handling, count] of groups)
          addBar(
            byId("finding-distribution"),
            handling,
            count,
            findings.length,
            "var(--accent)",
            `${count} 项 · ${percent(count, findings.length).toFixed(0)}%`,
          );
        if (!findings.length)
          byId("finding-distribution").append(
            element("p", "note", "无审查发现"),
          );
        setText(
          "finding-note",
          `共 ${findings.length} 条审查发现，按处理方式归组；每条发现计一次。`,
        );
        for (const finding of findings) {
          const item = element("li", "");
          item.dataset.finding = finding.id;
          item.append(
            element("b", "", `${finding.severity} · ${finding.label}`),
            element(
              "p",
              "",
              `${finding.review} · ${finding.handling} · ${finding.detail}`,
            ),
          );
          byId("finding-list").append(item);
        }

        const chartWidth = (svg) => {
          const container = svg.parentElement;
          const style = getComputedStyle(container);
          return (
            container.clientWidth -
            parseFloat(style.paddingLeft) -
            parseFloat(style.paddingRight)
          );
        };
        const drawTrend = () => {
          const svg = byId("trend");
          const width = chartWidth(svg);
          const height = 220;
          const left = 56,
            right = 16,
            upper = 20,
            lower = height - 40;
          svg.replaceChildren();
          svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
          svg.append(svgElement("title", {}, "每次派发完成时累计计入该次输出"));
          const points = dispatches
            .map((entry) => ({
              time: minutes(entry.start) + entry.minutes,
              output: entry.output,
              label: entry.id,
            }))
            .sort((a, b) => a.time - b.time);
          const maximum = total.output || 1;
          const x = (time) =>
            left + ((time - start) / span) * (width - left - right);
          const y = (value) => lower - (value / maximum) * (lower - upper);
          for (const value of [0, total.output / 2, total.output]) {
            svg.append(
              svgElement("line", {
                x1: left,
                x2: width - right,
                y1: y(value),
                y2: y(value),
                class: "grid-line",
              }),
            );
            svg.append(
              svgElement(
                "text",
                { x: left - 6, y: y(value) + 4, "text-anchor": "end" },
                `${(value / 1000).toFixed(0)}k`,
              ),
            );
          }
          for (const [time, anchor] of [
            [start, "start"],
            [start + span / 2, "middle"],
            [end, "end"],
          ])
            svg.append(
              svgElement(
                "text",
                { x: x(time), y: height - 12, "text-anchor": anchor },
                clock(time),
              ),
            );
          let cumulative = 0;
          const vertices = [[x(start), y(0)]];
          for (const point of points) {
            cumulative += point.output;
            vertices.push([x(point.time), y(cumulative)]);
            point.cumulative = cumulative;
          }
          svg.append(
            svgElement("polyline", {
              points: vertices.map((point) => point.join(",")).join(" "),
              class: "trend-line",
            }),
          );
          for (const point of points) {
            const marker = svgElement("circle", {
              cx: x(point.time),
              cy: y(point.cumulative),
              r: 3,
              class: "point",
            });
            marker.append(
              svgElement(
                "title",
                {},
                `${clock(point.time)} · ${point.label} · 累计 ${format(point.cumulative)} tokens`,
              ),
            );
            svg.append(marker);
          }
          setText(
            "trend-note",
            `${clock(start)} → ${clock(end)}，${dispatches.length} 次运行累计输出 ${format(total.output)} tokens；纵轴 k = 千 tokens。按完成时刻计入整次输出，点间连线只表示趋势。`,
          );
        };

        const drawFlow = () => {
          const svg = byId("flow");
          const width = chartWidth(svg);
          const compact = window.matchMedia("(max-width: 720px)").matches;
          const inset = 16,
            gap = 56,
            boxHeight = 72,
            step = boxHeight + gap;
          const boxWidth = compact
            ? width - inset * 2
            : (width - inset * 2 - gap) / 2;
          const positions = new Map(
            nodes.map((node, index) => [
              node.id,
              {
                x: inset + (compact ? 0 : node.col) * (boxWidth + gap),
                y: inset + (compact ? index : node.row) * step,
              },
            ]),
          );
          const height =
            Math.max(
              0,
              ...[...positions.values()].map(
                (position) => position.y + boxHeight,
              ),
            ) + inset;
          svg.replaceChildren();
          svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
          const defs = svgElement("defs");
          const arrow = svgElement("marker", {
            id: "flow-arrow",
            viewBox: "0 0 10 10",
            refX: 10,
            refY: 5,
            markerWidth: 6,
            markerHeight: 6,
            orient: "auto-start-reverse",
          });
          arrow.append(
            svgElement("path", {
              d: "M 0 0 L 10 5 L 0 10 Z",
              fill: "var(--accent)",
            }),
          );
          defs.append(arrow);
          svg.append(defs);
          for (const edge of edges) {
            const from = positions.get(edge.from),
              to = positions.get(edge.to);
            const horizontal = from.y === to.y;
            const forward = horizontal ? to.x > from.x : to.y > from.y;
            const x1 =
              from.x + (horizontal ? (forward ? boxWidth : 0) : boxWidth / 2);
            const x2 =
              to.x + (horizontal ? (forward ? 0 : boxWidth) : boxWidth / 2);
            const y1 =
              from.y + (horizontal ? boxHeight / 2 : forward ? boxHeight : 0);
            const y2 =
              to.y + (horizontal ? boxHeight / 2 : forward ? 0 : boxHeight);
            const line = svgElement("line", {
              x1,
              y1,
              x2,
              y2,
              class: "edge",
              "marker-end": "url(#flow-arrow)",
            });
            line.append(
              svgElement(
                "title",
                {},
                `${nodes.find((node) => node.id === edge.from).label} → ${nodes.find((node) => node.id === edge.to).label}`,
              ),
            );
            svg.append(line);
          }
          for (const node of nodes) {
            const { x, y } = positions.get(node.id);
            const group = svgElement("g", { "data-node": node.id });
            group.append(
              svgElement("rect", {
                x,
                y,
                width: boxWidth,
                height: boxHeight,
                rx: 8,
                class: "node",
              }),
            );
            group.append(
              svgElement(
                "text",
                {
                  x: x + boxWidth / 2,
                  y: y + 28,
                  "text-anchor": "middle",
                  class: "node-title",
                },
                node.label,
              ),
            );
            group.append(
              svgElement(
                "text",
                {
                  x: x + boxWidth / 2,
                  y: y + 50,
                  "text-anchor": "middle",
                  class: "node-detail",
                },
                node.detail,
              ),
            );
            svg.append(group);
          }
        };
        const redraw = () => {
          drawTrend();
          drawFlow();
        };
        redraw();
        new ResizeObserver(redraw).observe(byId("trend").parentElement);
      }
    </script>
  </body>
</html>
